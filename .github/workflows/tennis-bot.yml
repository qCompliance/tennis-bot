# .github/workflows/tennis-bot.yml
name: Tennis session auto-registration

on:
  schedule:
    # We only book FRIDAY sessions. Booking opens 7 days before each session
    # (same weekday) at ~10:00 London and sells out within minutes, so a watcher
    # MUST already be polling before 10:00. GitHub's scheduler can run jobs late,
    # so we start several hours early, at off-peak minutes (:37, not :00, to dodge
    # top-of-hour load), each in WATCH mode polling every ~15s through the open.
    # The concurrency lock serialises them and each exits once the day's opening is
    # resolved. 10:00 London = 09:00 UTC (BST) / 10:00 UTC (GMT). (Times are UTC.)
    - cron: '37 6 * * 5'    # ~07:37 London (BST) — early start, long poll
    - cron: '37 7 * * 5'    # ~08:37 London
    - cron: '37 8 * * 5'    # ~09:37 London — backup if earlier starts were delayed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reach checkout but DO NOT pay; empties basket)'
        type: boolean
        default: true
      target:
        description: 'Which sessions to book'
        type: choice
        options: [fri, wed, both]
        default: fri
      watch:
        description: 'Watch/poll mode (keep checking until the open session is grabbed)'
        type: boolean
        default: false
      waitlist_ok:
        description: 'If a target session is already full, join its waiting list (refundable fee)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tennis-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run registration bot
        env:
          CLUB_USER: ${{ secrets.CLUB_USER }}
          CLUB_PASS: ${{ secrets.CLUB_PASS }}
          WATCH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.watch)) && '1' || '' }}
          WATCH_MINUTES: '300'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'fri' }}
          WAITLIST_OK: ${{ github.event_name == 'workflow_dispatch' && inputs.waitlist_ok && '1' || '' }}
        run: node register.js

      - name: Upload screenshots & result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: out/

      - name: Notify by issue (GitHub emails you) — only when noteworthy
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = '';
            try { result = fs.readFileSync('out/result.txt', 'utf8').trim(); } catch {}
            const firstLine = (result.split('\n')[0] || '').trim();
            const jobOk = '${{ job.status }}' === 'success';
            const isError  = firstLine.startsWith('NOTIFY ERROR') || !jobOk;
            const isBooked = firstLine.startsWith('NOTIFY BOOKED');
            // Email ONLY when a booking happened or a real error occurred.
            // "Nothing to book" runs stay silent — no more false-failure spam.
            if (!isError && !isBooked) { core.info('Nothing noteworthy — no issue created.'); return; }
            const emoji = isError ? '❌' : '✅';
            const word  = isError ? 'needs attention' : 'booked a session';
            const date  = new Date().toLocaleDateString('en-GB', { timeZone: 'Europe/London' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Tennis bot ${word} — ${date}`,
              body: `\`\`\`\n${result || '(no result file)'}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nScreenshots are attached as artifacts on the run page.`
            });
