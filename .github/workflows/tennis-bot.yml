# .github/workflows/tennis-bot.yml
name: Tennis session auto-registration

on:
  schedule:
    # Sessions here become bookable ~2 weeks ahead (NOT in a seconds-long window),
    # and the soonest popular one fills over a day or two. So we don't race an
    # "opening" — we just scan every couple of hours and grab any target Wed/Fri
    # Level 3 session that is currently bookable and not already booked.
    # (Every 2 hours, every day. Times are UTC.)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reach checkout but DO NOT pay; empties basket)'
        type: boolean
        default: true
      target:
        description: 'Which sessions to book'
        type: choice
        options: [both, wed, fri]
        default: both
      waitlist_ok:
        description: 'If a target session is already full, join its waiting list (refundable fee)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tennis-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run registration bot
        env:
          CLUB_USER: ${{ secrets.CLUB_USER }}
          CLUB_PASS: ${{ secrets.CLUB_PASS }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
          WAITLIST_OK: ${{ github.event_name == 'workflow_dispatch' && inputs.waitlist_ok && '1' || '' }}
        run: node register.js

      - name: Upload screenshots & result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: out/

      - name: Notify by issue (GitHub emails you) — only when noteworthy
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = '';
            try { result = fs.readFileSync('out/result.txt', 'utf8').trim(); } catch {}
            const firstLine = (result.split('\n')[0] || '').trim();
            const jobOk = '${{ job.status }}' === 'success';
            const isError  = firstLine.startsWith('NOTIFY ERROR') || !jobOk;
            const isBooked = firstLine.startsWith('NOTIFY BOOKED');
            // Email ONLY when a booking happened or a real error occurred.
            // "Nothing to book" runs stay silent — no more false-failure spam.
            if (!isError && !isBooked) { core.info('Nothing noteworthy — no issue created.'); return; }
            const emoji = isError ? '❌' : '✅';
            const word  = isError ? 'needs attention' : 'booked a session';
            const date  = new Date().toLocaleDateString('en-GB', { timeZone: 'Europe/London' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Tennis bot ${word} — ${date}`,
              body: `\`\`\`\n${result || '(no result file)'}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nScreenshots are attached as artifacts on the run page.`
            });
