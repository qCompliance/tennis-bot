# .github/workflows/tennis-bot.yml
name: Tennis session auto-registration

on:
  schedule:
    # Tuesday & Thursday night runs. GitHub's scheduler can start jobs HOURS late
    # under load (observed ~2h20m on 2026-08-07, which pushed the run past midnight
    # and lost the session). Defence: fire several evening windows so at least one
    # run is already sitting in its midnight-wait even if GitHub is 2+ hours behind.
    # The concurrency lock below serialises them, so only the FIRST run books; the
    # rest start after midnight, see "already registered", and exit — no double-book.
    # (Times are UTC; London is BST/UTC+1 in summer.)
    - cron: '0 19 * * 2,4'   # ~20:00 London — earliest guard against late scheduling
    - cron: '0 20 * * 2,4'   # ~21:00 London
    - cron: '0 21 * * 2,4'   # ~22:00 London
    - cron: '30 22 * * 2,4'  # ~23:30 London — last window before midnight
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (stop before payment, empty basket)'
        type: boolean
        default: true
      target:
        description: 'Which session (auto = by weekday)'
        type: choice
        options: [auto, wed, fri]
        default: auto

permissions:
  contents: read
  issues: write

concurrency:
  group: tennis-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # allow an early-evening run to wait through to midnight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run registration bot
        env:
          CLUB_USER: ${{ secrets.CLUB_USER }}
          CLUB_PASS: ${{ secrets.CLUB_PASS }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'auto' }}
          WAITLIST_OK: '1'
        run: node register.js

      - name: Upload screenshots & result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: out/

      - name: Notify by issue (GitHub emails you)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = 'unknown';
            try { result = fs.readFileSync('out/result.txt', 'utf8').trim(); } catch {}
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${ok ? '✅' : '❌'} Tennis booking ${ok ? 'succeeded' : 'FAILED'} — ${new Date().toLocaleDateString('en-GB', {timeZone:'Europe/London'})}`,
              body: `Result: \`${result}\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nScreenshots are attached as artifacts on the run page.`
            });
