# .github/workflows/tennis-bot.yml
name: Tennis session auto-registration

on:
  schedule:
    # Booking opens 7 days before each session (SAME weekday) — so Wed sessions
    # open on a Wednesday and Fri sessions on a Friday — around midday, and the
    # popular Level 3 sessions sell out fast. We fire several staggered starts on
    # Wed & Fri; each runs in WATCH mode, polling every ~15s and grabbing the
    # session the instant it opens (and logging the exact open time). The
    # concurrency lock serialises them, and each exits as soon as the day's
    # opening is resolved, so they don't pile up. (Times are UTC.)
    - cron: '0 6 * * 3,5'    # ~07:00 London — early guard against GitHub delay
    - cron: '0 8 * * 3,5'    # ~09:00 London
    - cron: '0 10 * * 3,5'   # ~11:00 London — covers a midday open even if delayed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reach checkout but DO NOT pay; empties basket)'
        type: boolean
        default: true
      target:
        description: 'Which sessions to book'
        type: choice
        options: [both, wed, fri]
        default: both
      watch:
        description: 'Watch/poll mode (keep checking until the open session is grabbed)'
        type: boolean
        default: false
      waitlist_ok:
        description: 'If a target session is already full, join its waiting list (refundable fee)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tennis-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run registration bot
        env:
          CLUB_USER: ${{ secrets.CLUB_USER }}
          CLUB_PASS: ${{ secrets.CLUB_PASS }}
          WATCH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.watch)) && '1' || '' }}
          WATCH_MINUTES: '300'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
          WAITLIST_OK: ${{ github.event_name == 'workflow_dispatch' && inputs.waitlist_ok && '1' || '' }}
        run: node register.js

      - name: Upload screenshots & result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: out/

      - name: Notify by issue (GitHub emails you) — only when noteworthy
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = '';
            try { result = fs.readFileSync('out/result.txt', 'utf8').trim(); } catch {}
            const firstLine = (result.split('\n')[0] || '').trim();
            const jobOk = '${{ job.status }}' === 'success';
            const isError  = firstLine.startsWith('NOTIFY ERROR') || !jobOk;
            const isBooked = firstLine.startsWith('NOTIFY BOOKED');
            if (!isError && !isBooked) { core.info('Nothing noteworthy — no issue created.'); return; }
            const emoji = isError ? '❌' : '✅';
            const word  = isError ? 'needs attention' : 'booked a session';
            const date  = new Date().toLocaleDateString('en-GB', { timeZone: 'Europe/London' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Tennis bot ${word} — ${date}`,
              body: `\`\`\`\n${result || '(no result file)'}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nScreenshots are attached as artifacts on the run page.`
            });
